services:
  traefik:
    image: traefik:v3.6
    container_name: worksyne-traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - worksyne

  api:
    build:
      context: ..
      dockerfile: _deploy/api.Dockerfile
    container_name: worksyne-api
    user: "1000:1000"
    command: sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && php-fpm"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${API_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - ../api:/var/www/html
    networks:
      - worksyne

  api-nginx:
    image: nginx:1.27-alpine
    container_name: worksyne-api-nginx
    depends_on:
      - api
    volumes:
      - ../api:/var/www/html:ro
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.worksyne-api.rule=Host(`${API_HOST}`) || Host(`${API_WWW_HOST}`)
      - traefik.http.routers.worksyne-api.entrypoints=websecure
      - traefik.http.routers.worksyne-api.tls=true
      - traefik.http.routers.worksyne-api.priority=100
      - traefik.http.services.worksyne-api.loadbalancer.server.port=80
    networks:
      - worksyne

  client:
    image: node:24-alpine
    container_name: worksyne-client
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${API_URL}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../client:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.worksyne-client.rule=Host(`${CLIENT_HOST}`) || Host(`${CLIENT_WWW_HOST}`)
      - traefik.http.routers.worksyne-client.entrypoints=websecure
      - traefik.http.routers.worksyne-client.tls=true
      - traefik.http.routers.worksyne-client.priority=10
      - traefik.http.services.worksyne-client.loadbalancer.server.port=5173
    networks:
      - worksyne

  mysql:
    image: mysql:8.4
    container_name: worksyne-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - worksyne

volumes:
  mysql_data:

networks:
  worksyne:
    driver: bridge
